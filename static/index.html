<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spend Tracker — Expenses</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page-header-row">
  <div class="page-header">
    <h1>Spend Tracker</h1>
    <p>Log expenses and keep an eye on how your spending shifts month to month.</p>
  </div>
  <div class="api-key-inline">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="text">
  </div>
</div>

<nav class="tabs">
  <a href="/index.html" class="active">Expenses</a>
  <a href="/summary.html">Summary</a>
</nav>

<section>
  <h2>Add Expense</h2>
  <form id="expenseForm" novalidate>
    <div class="form-grid">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" aria-describedby="amountError">
        <div class="field-error" id="amountError" role="alert"></div>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" aria-describedby="dateError">
        <div class="field-error" id="dateError" role="alert"></div>
      </div>
      <div class="field full">
        <label for="note">Note (optional)</label>
        <input id="note" type="text" placeholder="e.g. lunch with client">
      </div>
      <div class="field full">
        <label for="category">Category</label>
        <div class="combobox">
          <input id="category" type="text" placeholder="e.g. food, travel" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="categoryListbox" aria-autocomplete="list"
                 aria-describedby="categoryError">
          <ul id="categoryListbox" class="combobox-list hidden" role="listbox"></ul>
        </div>
        <div class="field-error" id="categoryError" role="alert"></div>
      </div>
    </div>
    <div class="actions">
      <button type="submit" id="addExpenseBtn">Add Expense</button>
      <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
    </div>
    <div class="banner" id="expenseBanner" role="status" aria-live="polite"></div>
  </form>
</section>

<section>
  <h2>Browse Expenses</h2>
  <div class="form-grid">
    <div class="field">
      <label for="filterStart">From</label>
      <input id="filterStart" type="date">
    </div>
    <div class="field">
      <label for="filterEnd">To</label>
      <input id="filterEnd" type="date">
    </div>
    <div class="field full">
      <label for="filterCategory">Category</label>
      <div class="combobox">
        <input id="filterCategory" type="text" placeholder="Filter by category" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="filterCategoryListbox" aria-autocomplete="list">
        <ul id="filterCategoryListbox" class="combobox-list hidden" role="listbox"></ul>
      </div>
    </div>
  </div>
  <div class="actions">
    <button type="button" id="applyFilterBtn">Apply Filters</button>
  </div>
  <div class="banner" id="listBanner" role="status" aria-live="polite"></div>
  <div id="listContent" class="content-block">
    <p class="empty-state">Loading…</p>
  </div>
  <div class="pagination">
    <span class="page-info" id="pageInfo"></span>
    <div class="button-group">
      <button type="button" class="secondary small" id="prevPageBtn">Previous</button>
      <button type="button" class="secondary small" id="nextPageBtn">Next</button>
    </div>
  </div>
</section>

<script src="/app.js"></script>
<script src="/js/date-utils.js"></script>
<script src="/js/category-combobox.js"></script>
<script src="/js/confirm-dialog.js"></script>
<script src="/js/category-directory.js"></script>
<script src="/js/expense-form.js"></script>
<script src="/js/expense-list.js"></script>
<script src="/js/expenses-page.js"></script>
</body>
</html>
